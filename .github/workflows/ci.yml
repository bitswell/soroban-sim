name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  release-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/sync-package-assets.py --check
      - run: python scripts/sync-protocol-twins.py --check
      - run: python scripts/check-upstream-host.py
      - run: python scripts/test-release-tools.py
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages
      - run: python scripts/check-packages.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --locked
      - run: cargo check -p soroban-sim-component --target wasm32-wasip2 --locked

  # The 9-target binary matrix only runs for release-plz's release PR branch
  # (default prefix `release-plz-`; release-plz.toml does not override it).
  # Tag releases still build every binary in cd-soroban-sim.yml.
  binaries:
    if: >-
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')) ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'release-plz-'))
    uses: ./.github/workflows/build-cli.yml

  sign-dialog:
    runs-on: ubuntu-latest
    env:
      BINARYEN_VERSION: '131'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: sign-dialog
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false
      - name: Install binaryen (wasm-opt)
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Reactor tests, host 29 and host 30
        run: |
          cargo test -p soroban-sim-preview --locked
          cargo test -p soroban-sim-preview --locked --no-default-features --features p30
      - run: pnpm install --frozen-lockfile
      - name: Build the package (reactors, wasm-opt, bundles)
        run: pnpm --filter @theahaco/soroban-sign-dialog build
      - name: Size budgets (tree view <= 20 KB, engine <= 600 KB brotli)
        run: pnpm --filter @theahaco/soroban-sign-dialog size
      - name: Decoder, comparison, engine and SSR tests
        run: pnpm --filter @theahaco/soroban-sign-dialog test
      - name: Type declarations
        run: pnpm --filter @theahaco/soroban-sign-dialog check
      - name: Install browser
        run: pnpm --filter @theahaco/soroban-sign-dialog exec playwright install --with-deps chromium
      - name: Demo and framework browser tests
        run: pnpm --filter @theahaco/soroban-sign-dialog test:browser

  milestone-0:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,wasm32v1-none

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false

      - name: Install Wasmtime
        run: brew install wasmtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm --filter @theahaco/soroban-sim-web-demo exec playwright install chromium

      - name: Milestone 0 proof
        run: pnpm run m0
