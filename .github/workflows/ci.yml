name: ci

on:
  push:
  pull_request:

jobs:
  milestone-0:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,wasm32v1-none

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false

      - name: Install Wasmtime
        run: brew install wasmtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm --filter @theahaco/soroban-sim-web-demo exec playwright install chromium

      - name: Milestone 0 proof
        run: pnpm run m0
