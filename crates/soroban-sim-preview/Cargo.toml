[package]
name = "soroban-sim-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
publish = false
description = "The signing-preview reactor behind @theahaco/soroban-sign-dialog: one Soroban transaction, recorded and enforced, for wasm32-wasip1"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["p29"]
# Exactly one host protocol per build. The sign dialog's engine downloads the
# build whose protocol matches the network's `protocolVersion`.
p29 = ["dep:soroban-env-host-p29", "dep:soroban-simulation-p29"]
p30 = ["dep:soroban-env-host-p30", "dep:soroban-simulation-p30"]

[dependencies]
sha2.workspace = true
soroban-env-host-p29 = { package = "soroban-env-host", version = "=29.0.2", features = ["recording_mode"], optional = true }
soroban-simulation-p29 = { package = "soroban-simulation", version = "=29.0.2", optional = true }
soroban-env-host-p30 = { package = "soroban-env-host", version = "=30.0.0", features = ["recording_mode"], optional = true }
soroban-simulation-p30 = { package = "soroban-simulation", version = "=30.0.0", optional = true }

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
