[package]
name = "soroban-sim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Rehearse a multi-transaction Soroban setup on a forked network"

[[bin]]
name = "soroban-sim"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2.workspace = true
soroban-env-host = { workspace = true, features = ["recording_mode"] }
soroban-sim-core = { path = "../soroban-sim-core" }
soroban-simulation.workspace = true
# The XDR crate soroban-env-host links, with serde for plan-file ScVal JSON.
stellar-xdr = { version = "=28.0.0", features = ["serde", "base64"] }
ureq = { version = "2.12", features = ["json"] }
flate2 = "1"
