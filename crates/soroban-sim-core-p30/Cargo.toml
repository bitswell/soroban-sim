[package]
name = "soroban-sim-core-p30"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "soroban-sim-core against the protocol-30 Soroban host (a generated copy of its sources)"
autoexamples = false
autotests = false
autobenches = false

# The sources are soroban-sim-core's (scripts/sync-protocol-twins.py). Their unit tests
# run here against protocol 30; integration tests and doctests (which name
# `soroban_sim_core`) run in soroban-sim-core.
[lib]
doctest = false

[dependencies]
anyhow.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
sha2.workspace = true
# The same dependency names as soroban-sim-core, so the copied sources build
# unchanged against the protocol-30 releases.
soroban-env-host = { version = "=30.0.0", features = ["recording_mode"] }
soroban-simulation = "=30.0.0"
stellar-strkey.workspace = true

# Transactions apply with the recording-mode host: there is no isolated
# protocol-30 application host (soroban-sim-host) yet.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("exact-apply"))'] }

[dev-dependencies]
base64 = "0.22"
hex = "0.4.3"
serde_json = "1"
